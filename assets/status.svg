.9"/><text class="m" x="706" y="51" font-size="12.5" fill="#D1A5AE" textLength="46" lengthAdjust="spacing">FOCUS</text><text x="688" y="88" font-size="22" font-weight="700" fill="#FFF1F2">Java &#183; Web &#183; SQL</text></g></svg>