    <text x="600" y="250" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="40" font-weight="700" fill="#60A5FA" fill-opacity="0.16">;<animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="8s" repeatCount="indefinite"/></text>
    <text x="800" y="60" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#60A5FA" fill-opacity="0.2">[ ]<animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0" dur="6.5s" repeatCount="indefinite"/></text>
    <text x="690" y="190" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#60A5FA" fill-opacity="0.17">=&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="10s" repeatCount="indefinite"/></text>
    <text x="1240" y="120" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#60A5FA" fill-opacity="0.18">01<animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="8.5s" repeatCount="indefinite"/></text>
    <text x="560" y="345" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="26" font-weight="700" fill="#60A5FA" fill-opacity="0.15">&amp;&amp;<animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="7.5s" repeatCount="indefinite"/></text>
    <text x="1235" y="330" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="30" font-weight="700" fill="#60A5FA" fill-opacity="0.2">()<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="9.5s" repeatCount="indefinite"/></text>
    <text x="520" y="60" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="28" font-weight="700" fill="#60A5FA" fill-opacity="0.15">#<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/></text>

