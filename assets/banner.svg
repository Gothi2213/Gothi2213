      <path d="M0 16a16 16 0 0 1 16-16h328a16 16 0 0 1 16 16v26H0z" fill="#101B38"/>
      <circle cx="26" cy="21" r="5.5" fill="#3B82F6"/><circle cx="46" cy="21" r="5.5" fill="#22D3EE" fill-opacity="0.75"/><circle cx="66" cy="21" r="5.5" fill="#93C5FD" fill-opacity="0.45"/>
      <text x="334" y="26" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#6B7C99">developer.java</text>
      <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15.5">
        <text x="24" y="78" clip-path="url(#ln0)"><tspan fill="#60A5FA">class</tspan><tspan fill="#E5EDFF"> Developer </tspan><tspan fill="#8B9BB4">{</tspan></text>
        <text x="44" y="106" clip-path="url(#ln1)"><tspan fill="#60A5FA">String</tspan><tspan fill="#E5EDFF"> status = </tspan><tspan fill="#67E8F9">"learning"</tspan><tspan fill="#8B9BB4">;</tspan></text>
        <text x="44" y="132" clip-path="url(#ln2)"><tspan fill="#60A5FA">String</tspan><tspan fill="#8B9BB4">[]</tspan><tspan fill="#E5EDFF"> stack = </tspan><tspan fill="#8B9BB4">{</tspan></text>
        <text x="64" y="158" clip-path="url(#ln3)"><tspan fill="#67E8F9">"Java"</tspan><tspan fill="#8B9BB4">, </tspan><tspan fill="#67E8F9">"JS"</tspan><tspan fill="#8B9BB4">, </tspan><tspan fill="#67E8F9">"SQL"</tspan></text>
        <text x="44" y="184" clip-path="url(#ln4)"><tspan fill="#8B9BB4">};</tspan></text>
        <text x="44" y="210" clip-path="url(#ln5)"><tspan fill="#60A5FA">void</tspan><tspan fill="#E5EDFF"> grow</tspan><tspan fill="#8B9BB4">() { build(); }</tspan></text>
      </g>
      <rect x="44" y="226" width="9" height="18" fill="#22D3EE"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
