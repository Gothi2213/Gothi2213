<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Thiago Sarco - Software Developer in Training">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1833"/><stop offset="1" stop-color="#080D1B"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
