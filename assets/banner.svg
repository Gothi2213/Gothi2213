    <rect x="72" y="298" width="66" height="32" rx="16" fill="#0E1A3A" stroke="#2563EB" stroke-opacity="0.65"/><text x="105.0" y="319" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#BFDBFE">Java</text><rect x="150" y="298" width="112" height="32" rx="16" fill="#0E1A3A" stroke="#2563EB" stroke-opacity="0.65"/><text x="206.0" y="319" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#BFDBFE">JavaScript</text><rect x="274" y="298" width="58" height="32" rx="16" fill="#0E1A3A" stroke="#2563EB" stroke-opacity="0.65"/><text x="303.0" y="319" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#BFDBFE">SQL</text><rect x="344" y="298" width="156" height="32" rx="16" fill="#0E1A3A" stroke="#2563EB" stroke-opacity="0.65"/><text x="422.0" y="319" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#BFDBFE">Web Development</text>

