<circle r="3" cy="86.8" fill="#F97316" class="mo"><animate attributeName="cx" values="880;20;20" keyTimes="0;.55;1" dur="11s" begin="-8.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .2 1;0 0 1 1"/>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.5;.58;1" dur="11s" begin="-8.5s" repeatCount="indefinite"/></circle></svg>