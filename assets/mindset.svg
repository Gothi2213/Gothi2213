" opacity=".35" style="mix-blend-mode:soft-light"/></g><path d="M20,0H186Q206,0 206,20V230Q206,250 186,250H20Q0,250 0,230V20Q0,0 20,0Z" fill="none" stroke="url(#hl)" stroke-width="1.5"/><text x="194" y="236" font-size="86" font-weight="900" text-anchor="end" fill="none" stroke="#F97316" stroke-opacity=".28" stroke-width="1.4">02</text><rect x="20" y="26" width="26" height="3" rx="1.5" fill="#F97316"/><text x="20" y="66" font-size="29" font-weight="800" fill="#FFF1F2">Build</text><text x="20" y="96" font-size="15" fill="#D1A5AE">Turn ideas into</text><text x="20" y="117" font-size="15" fill="#D1A5AE">functional software</text></g></g><g transform="translate(452,62)" class="in" style="animation-delay:0.28s"><g class="fl" style="animation-delay:-2.6s;animation-duration:7.1s"><g clip-path="url(#m2)"><rect width="206" height="300" fill="url(#bg)"/><ellipse cx="103.0" cy="0" rx="164.8" ry="150.0" fill="#F472B6" opacity=".16"/><polygon points="0,0 36,0 16,300 -20,300" fill="#fff" fill-opacity=".07" class="mo"><animateTransform attributeName="transform" type="translate" values="-60 0;286 0;286 0" keyTimes="0;.3;1" dur="12.0s" begin="-4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .25 1;0 0 1 1"/></polygon><rect width="206" height="300" fill="url(#gr)" opacity=".35" style="mix-blend-mode:soft-light"/></g><path d="M20,0H186Q206,0 206,20V280Q206,300 186,300H20Q0,300 0,280V20Q0,0 20,0Z" fill="none" stroke="url(#hl)" stroke-width="1.5"/><text x="194" y="286" font-size="86" font-weight="900" text-anchor="end" fill="none" stroke="#F472B6" stroke-opacity=".28" stroke-width="1.4">03</text><rect x="20" y="26" width="26" height="3" rx="1.5" fill="#F472B6"/><text x="20" y="66" font-size="29" font-weight="800" fill="#FFF1F2">Improve</text><text x="20" y="96" font-size="15" fill="#D1A5AE">Learn from mistakes and</text><text x="20" y="117" font-size="15" fill="#D1A5AE">refine the solution</text></g></g><g transform="translate(674,10)" class="in" style="animation-delay:0.