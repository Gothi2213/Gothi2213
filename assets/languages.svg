text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.2);opacity:0}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.in{animation:in 1s cubic-bezier(.2,.8,.2,1) both}
.rot{animation:rot linear infinite;transform-origin:0 0}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s cubic-bezier(.2,.6,.3,1) infinite}
.tw{animation:tw 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important} .mo{display:none}}
@keyframes shm{from{transform:translateX(-160px)}to{transform:translateX(620px)}}.shm{animation:shm 3.6s cubic-bezier(.45,0,.35,1) infinite}</style><g clip-path="url(#lg)"><rect width="900" height="150" fill="url(#bg)"/><ellipse cx="450" cy="170" rx="500" ry="90" fill="url(#aB)" opacity=".7"/><rect width="900" height="150" fill="url(#gr)" opacity=".35" style="mix-blend-mode:soft-light"/></g><path d="M24,0H876Q900,0 900,24V126Q900,150 876,150H24Q0,150 0,126V24Q0,0 24,0Z" fill="none" stroke="url(#hl)" stroke-width="1.5"/><g class="in"><text class="m" x="40" y="52" font-size="13" fill="#F97316" letter-spacing="2.5">ES</text><text x="82" y="54" font-size="22" font-weight="800" fill="#FFF1F2">Spanish</text>
<text class="m" x="860" y="52" font-size="12.5" text-anchor="end" fill="#4ADE80" letter-spacing="2.5">NATIVE</text><rect x="40" y="68" width="820" height="10" rx="5" fill="url(#acc)"/></g>
<g class="in" style="animation-delay:.2s"><text class="m" x="40" y="108" font-size="13" fill="#FB7185" letter-spacing="2.5">EN</text><text x="82" y="110" font-size="22" font-weight="800" fill="#FFF1F2">English</text>
<text class="m" x="860" y="108" font-size="12.5" text-anchor="end" fill="#FB7185" letter-spacing="2.5">IMPROVING</text>
